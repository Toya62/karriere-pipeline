services:
  karriere:
    init: true
    build: .
    image: ghcr.io/toya62/karriere-pipeline:latest
    container_name: karriere-dashboard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # F14: only the runtime data directories are bind-mounted. The Python
      # code, templates and frontend run from the built image — the container
      # no longer executes whatever happens to be in the host working tree.
      # NOTE: user_profile.yml / filter_config.yml must exist on the host
      # before `docker compose up` (cp from the .example files); Docker
      # creates a directory for a bind-mounted path that does not exist.
      - ./data:/app/data
      - ./applications:/app/applications
      - ./templates:/app/templates
      - ./user_profile.yml:/app/user_profile.yml
      - ./filter_config.yml:/app/filter_config.yml
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      # F8: DATABASE_URL is loaded from .env but made explicit here so the
      # deploy path cannot silently fall back to SQLite. It must point at the
      # external karriere-postgres container on the web-proxy network.
      # main.py refuses to start in multi-user mode when it is unset.
      DATABASE_URL: ${DATABASE_URL:-}
    restart: unless-stopped
    networks:
      - web-proxy

networks:
  web-proxy:
    external: true
