services:
  karriere:
    build: .
    image: ghcr.io/toya62/karriere-pipeline:latest
    container_name: karriere-dashboard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./applications:/app/applications
      - ./user_profile.yml:/app/user_profile.yml
      - ./templates:/app/templates
      - ./src:/app/src
      - ./dashboard:/app/dashboard
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
    restart: unless-stopped
