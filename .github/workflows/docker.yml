name: Docker Build & Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'main.py'
      - 'src/**'
      - 'dashboard/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Oracle Server (Production)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::notice::Deploy secrets (SERVER_HOST / SERVER_SSH_KEY) not configured. Skipping deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          # Stash any runtime dirty files (e.g. seed_*.json) on server before push
          HAS_STASH=$(ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" '
            cd /opt/karriere-pipeline
            if [ -n "$(git status --porcelain)" ]; then
              git stash push -u -m "auto-deploy-stash" >/dev/null
              echo 1
            else
              echo 0
            fi
          ')

          # Push main directly over SSH (server has receive.denyCurrentBranch=updateInstead)
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git push "ssh://${SERVER_USER}@${SERVER_HOST}/opt/karriere-pipeline" HEAD:main

          # Restore runtime edits, pull new multi-arch image, and restart container
          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" "
            set -euo pipefail
            cd /opt/karriere-pipeline
            if [ \"$HAS_STASH\" = \"1\" ]; then
              git stash pop || true
            fi
            docker compose pull
            docker compose up -d --remove-orphans
          "
