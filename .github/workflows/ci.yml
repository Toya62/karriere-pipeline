name: CI Tests

on:
  push:
    branches:
      - main
      - feat/vite-ts-frontend
    paths:
      - 'src/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - feat/vite-ts-frontend
    paths:
      - 'src/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v

  frontend:
    name: Frontend Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit Tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and Build
        working-directory: frontend
        run: npm run build
