# filter_config.example.yml — Public Template
# ─────────────────────────────────────────────────────────────────────────────
# This is the public template for keyword-based filtering in the job pipeline.
# To customize for your profile:
#   cp filter_config.example.yml filter_config.yml
#
# The pipeline will automatically load filter_config.yml if present,
# falling back to this example file if not.
#
# IMPORTANT: filter_config.yml is gitignored so your personal filters stay private.
# ─────────────────────────────────────────────────────────────────────────────


# ── 1. Seniority gate ─────────────────────────────────────────────────────────
# Jobs with these words in the TITLE are treated as senior-level.
# Remove words that apply to your target roles.
seniority:
  senior_title_keywords:
    - senior
    - lead
    - principal
    - head of
    - director
    - staff
    - architect
    - architekt
    - manager
    - chapter lead
    - tech lead
    - engineering manager
    - vp of
    - vice president
    - c-level
    - cto
    - ciso
    - teamleiter
    - teamleitung
    - professur
    - professor

  # Job levels the LinkedIn API may return — these are always rejected
  reject_level_values:
    - senior
    - director
    - executive


# ── 2. CS relevance gate ─────────────────────────────────────────────────────
# Research roles (e.g. "Wissenschaftlicher Mitarbeiter") are only KEPT if the
# description contains at least one of these keywords.
